name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Example config builds and validates
        run: |
          cp examples/flutter_demo/web/index.html /tmp/index.html
          python -m flutter_web_seo build -c examples/routes.json -t /tmp/index.html -o /tmp/site --strict
          python -m flutter_web_seo validate -c examples/routes.json --out /tmp/site --strict
