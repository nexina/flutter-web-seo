<!DOCTYPE html>
<html lang="en">
<head>
  <!-- "/" keeps nested shells (/word-counter/) loading main.dart.js from the root. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO_HEAD_START -->
  <title>Demo app</title>
  <!-- SEO_HEAD_END -->

  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    body{margin:0;font-family:system-ui,sans-serif}
    #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:#fff;text-align:center}
    #boot-title{margin:0;max-width:560px;font-size:22px;line-height:1.35}
  </style>
</head>
<body>
  <div id="boot-splash"><p id="boot-title">Demo app</p></div>

  <!-- SEO_CONTENT_START -->
  <div id="seo-content" class="visually-hidden"><h1>Demo app</h1></div>
  <!-- SEO_CONTENT_END -->

  <script>
    // Remove the splash once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('boot-splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
