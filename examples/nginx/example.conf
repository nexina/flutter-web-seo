# Serving a Flutter web app that was post-processed by flutter-web-seo.
#
# Goals:
#   1. /word-counter/  ->  301 /word-counter   (one canonical URL, no slash)
#   2. /word-counter   ->  the generated word-counter/index.html shell
#   3. unknown paths   ->  a REAL 404 status (no "soft 404" that returns the
#                          app shell with 200, which search engines index)
#   4. *.js / *.wasm   ->  never indexed (X-Robots-Tag), long cache
#
# known_paths.conf lists the routes the Flutter app handles client-side that
# have no shell file on disk (optional; see README "nginx").

server {
    listen 80;
    server_name example.com;
    root /var/www/example;
    index index.html;

    # 1. Trailing slash -> 301 to the canonical form (never the root).
    rewrite ^/(.+)/$ /$1 permanent;

    # 4. Build artefacts: do not index, cache hard. Flutter fingerprints
    #    main.dart.js via flutter_bootstrap.js, so use a modest max-age
    #    unless you serve hashed filenames.
    location ~* \.(js|mjs|wasm|map)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static assets.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # sitemap / robots / IndexNow key: plain files.
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }

    # 2 + 3. File, then directory shell, otherwise a real 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Custom 404 page (generate a static /404.html; keep the 404 status).
    error_page 404 /404.html;
    location = /404.html { internal; }
}
